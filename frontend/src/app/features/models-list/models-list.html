<div class="view-header">
  <h2>Model Inventory</h2>
  <button mat-raised-button color="primary" (click)="onCreateModel()">
    <mat-icon>add</mat-icon> Create Model
  </button>
</div>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<div *ngIf="!loading">
  <table mat-table [dataSource]="models" class="mat-elevation-z2" *ngIf="models.length > 0; else noModels">

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> <strong>{{element.id}}</strong> </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Owner Column -->
    <ng-container matColumnDef="owner">
      <th mat-header-cell *matHeaderCellDef> Owner </th>
      <td mat-cell *matCellDef="let element"> {{element.owner}} </td>
    </ng-container>

    <!-- Framework Column -->
    <ng-container matColumnDef="framework">
      <th mat-header-cell *matHeaderCellDef> Framework </th>
      <td mat-cell *matCellDef="let element">
        <span class="framework-badge">{{element.framework}}</span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element" class="actions-cell">
        <button mat-button color="primary" [routerLink]="['/models', element.id]">
          View Details <mat-icon>arrow_forward</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="model-row"></tr>
  </table>
</div>

<ng-template #noModels>
  <div class="empty-state">
    <mat-icon>inventory_2</mat-icon>
    <h3>No Models Found</h3>
    <p>Get started by creating your first machine learning model.</p>
  </div>
</ng-template>

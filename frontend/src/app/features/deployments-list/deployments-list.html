<div class="view-header">
  <h2>Deployments</h2>
  <button mat-button color="primary" (click)="loadDeployments()">
    <mat-icon>refresh</mat-icon> Refresh
  </button>
</div>

<div *ngIf="loading" class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<div *ngIf="!loading">
  <table mat-table [dataSource]="deployments" class="mat-elevation-z2" *ngIf="deployments.length > 0; else noData">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="model_version_id">
      <th mat-header-cell *matHeaderCellDef> Version ID </th>
      <td mat-cell *matCellDef="let element"> {{element.model_version_id}} </td>
    </ng-container>

    <ng-container matColumnDef="environment">
      <th mat-header-cell *matHeaderCellDef> Environment </th>
      <td mat-cell *matCellDef="let element">
        <span class="env-badge {{element.environment | lowercase}}">{{element.environment}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        <span class="status-badge {{element.status | lowercase}}">{{element.status}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element" class="actions-cell">
        <button mat-icon-button color="primary" *ngIf="element.status === 'FAILED'" (click)="retryDeployment(element.id)" title="Retry">
          <mat-icon>replay</mat-icon>
        </button>
        <button mat-icon-button color="warn" *ngIf="element.status === 'SUCCEEDED'" (click)="rollbackDeployment(element.id)" title="Rollback">
          <mat-icon>undo</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<ng-template #noData>
  <div class="empty-state">
    <mat-icon>rocket_launch</mat-icon>
    <h3>No Deployments Found</h3>
    <p>Deploy a model version to see it here.</p>
  </div>
</ng-template>
